<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>钱智健的个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }

        header {
            background-color: #1a237e;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            font-size: 48px;
            letter-spacing: 5px;
            margin-bottom: 10px;
        }

        header p {
            font-style: italic;
            font-size: 18px;
        }

        .profile {
            display: flex;
            align-items: center;
            background-color: #b3e5fc;
            margin: 20px;
            padding: 20px;
            border-radius: 10px;
        }

        .profile img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid white;
            margin-right: 30px;
            object-fit: cover;
        }

        .profile-text h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .skills {
            background-color: white;
            margin: 20px;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .skills h2 {
            color: #1a237e;
            border-bottom: 2px solid #1a237e;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .skill {
            display: inline-block;
            padding: 8px 20px;
            margin: 5px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        .skill:nth-child(2) { background-color: #a5d6a7; } 
        .skill:nth-child(3) { background-color: #f8bbd0; } 
        .skill:nth-child(4) { background-color: #e0e0e0; } 
        .skill:nth-child(5) { background-color: #f8bbd0; } 

        .about {
            background-color: white;
            margin: 20px;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .about h2 {
            color: #1a237e;
            border-bottom: 2px solid #1a237e;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .contact {
            background-color: white;
            margin: 20px;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .contact h2 {
            color: #1a237e;
            border-bottom: 2px solid #1a237e;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .contact label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        .contact input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .contact input[type="text"] {
            background-color: #fff9c4; 
        }

        .contact input[type="email"] {
            background-color: #e0f7fa;
        }

        .contact button {
            margin-top: 15px;
            padding: 12px 30px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .contact button:hover {
            background-color: #555;
        }

        /* 页脚 */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>MY PROFILE</h1>
        <p>Web Programming Practice</p >
    </header>

    <section class="profile">
        <img src="https://via.placeholder.com/150" alt="个人照片">
        <div class="profile-text">
            <h2>钱智健</h2>
            <p>专业：计算机相关专业</p >
            <p>兴趣方向：Web / AI / XR</p >
        </div>
    </section>

    <section class="skills">
        <h2>关注技术</h2>
        <span class="skill">HTML</span>
        <span class="skill">CSS</span>
        <span class="skill">JavaScript</span>
        <span class="skill">Git</span>
    </section>

    <section class="about">
        <h2>自我介绍</h2>
        <p>大家好，我是钱智健。我目前正在学习 Web 编程，通过 HTML 和 CSS 来掌握网页结构和页面设计的实现方法。接下来我还会继续学习 JavaScript 和 React，希望将来能够开发出可以与用户交互的多种 Web 服务。</p >
    </section>

    <section class="contact">
        <h2>联系我们</h2>
        <label>姓名</label>
        <input type="text" placeholder="请输入姓名">
        <label>邮箱</label>
        <input type="email" placeholder="请输入邮箱">
        <button>提交</button>
    </section>

    <footer>
        <p>2026 Web Programming Practice | 钱智健</p >
    </footer>
</body>
</html>
